<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moaye Service</title>
    
    <!-- 🌟 CRITICAL CSS : Force l'affichage du fond blanc ET du rond dès le premier millième de seconde -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #ffffff !important;
        width: 100%;
        height: 100%;
      }
      
      .global-site-loader-wrapper {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background-color: #ffffff !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        align-items: center !important;
        z-index: 999999 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        box-sizing: border-box;
        opacity: 1;
        transition: opacity 0.25s ease-out;
      }
      
      .moaye-main-spinner {
        width: 46px !important;
        height: 46px !important;
        border: 4px solid #eaeded !important;
        border-top-color: #114314 !important; /* Vert officiel Moaye Service */
        border-radius: 50% !important;
        animation: siteSpin 0.8s linear infinite !important;
        margin-bottom: 18px !important;
      }
      
      .loader-brand-text {
        margin: 0 !important;
        font-size: 1.4rem !important;
        color: #114314 !important;
        font-weight: 700 !important;
        text-align: center !important;
        letter-spacing: 0.5px !important;
      }
      
      .loader-sub-text {
        margin: 6px 0 0 0 !important;
        font-size: 0.85rem !important;
        color: #7f8c8d !important;
        text-align: center !important;
      }
      
      @keyframes siteSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    
    <!-- 🌟 LE LOADER EST PLACÉ ICI EN PREMIER : IL SORT AVEC LE BLANC EN MÊME TEMPS -->
    <div class="global-site-loader-wrapper" id="initial-html-loader">
      <div class="moaye-main-spinner"></div>
      <h3 class="loader-brand-text">Moaye Service</h3>
      <p class="loader-sub-text">Chargement de la plateforme agropastorale...</p>
    </div>

    <!-- React viendra s'injecter ici une fois téléchargé -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
